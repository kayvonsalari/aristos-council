# MARKET-INDEX-1 — which venues the local market index tracks.
#
# The index is a table of every listed COMMON STOCK with its classification and size,
# built once from EODHD and queried locally. It exists because no per-report peers
# endpoint works on this plan: Finnhub /stock/peers is 403 for every non-US symbol and
# caps at 12 names where it answers, EODHD's /screener is 403, and S&P 500 + STOXX 600
# together hold a median of six companies per industry. See docs/MARKET_INDEX.md.
#
# Editing this file changes what a BUILD fetches. It does not change a table already
# built: rows are keyed by ticker and only removed by deleting the index.
#
# Cost: roughly one call per listed common stock, plus one per exchange for the listing.
# Rows younger than max_age_days are skipped without a call, so a re-run is cheap.

# MARKET-INDEX-SKIP-1 / INDEX-CAP-RETRY-1 - which codes this plan actually serves, PROBED
# rather than assumed.
#
# MILAN IS REMOVED. /exchange-symbol-list/MI answers HTTP 404 on every build, and on
# 2026-09-24 the obvious alternative spellings were tried directly against the endpoint:
#
#     MI -> 404    MTA -> 404    BIT -> 404    MIL -> 404    IT -> 404    XMIL -> 404
#
# so there is no code to correct it to; Milan is not on this plan. It is deleted rather than
# left to be skipped, because a listing request that is KNOWN to 404 costs a request and a
# line of noise on every single build, and the comment is a better record of the reason than a
# recurring skip is. Restore it the day the plan gains Borsa Italiana.
#
# INDEX-EXCHANGE-CODES-1 - KOREA AND TOKYO, probed 2026-09-25, one request each:
#
#     /exchange-symbol-list/KO  -> answered, 941 common stocks    (KOSPI)
#     /exchange-symbol-list/KQ  -> answered, 1,849 common stocks  (KOSDAQ)
#     /exchange-symbol-list/TSE -> 404
#
# "KS" was never EODHD's code for Korea: Korea is TWO exchanges, KO and KQ, and both are listed
# below. "T" and "TSE" both 404, so TOKYO IS NOT LISTED HERE - there is no code known to work,
# and a listing request that is KNOWN to 404 costs a request and a line of noise on every build
# (the Milan precedent above). Restore it under the code that answers, once one is found.
#
# The earlier reading that HK was also absent turned out to be WRONG - /exchanges-list omits HK,
# yet /exchange-symbol-list/HK serves 3,512 names (build log, 2026-09-23T09:22:20). The
# exchange-list endpoint is not authoritative about what the symbol-list endpoint will serve,
# which is exactly why these are probed one at a time and not trusted wholesale.
exchanges:
  # North America
  - US            # NYSE + NASDAQ + AMEX, the deepest single pool of comparables
  - TO            # Toronto
  # Europe
  - XETRA
  - LSE
  - PA            # Euronext Paris
  - AS            # Euronext Amsterdam
  - MC            # Madrid
  - SW            # SIX Swiss
  - ST            # Stockholm
  - CO            # Copenhagen
  - OL            # Oslo
  - HE            # Helsinki
  # Asia-Pacific and Latin America — where the comparables for a chip maker, a miner or
  # a shipping line are actually listed. Peers follow the industry, not the listing.
  - HK
  - KO            # Korea KOSPI
  - KQ            # Korea KOSDAQ
  - AU            # Australia
  - TW            # Taiwan
  - SA            # Brazil

# A row older than this is refetched by `refresh`. Classification and venue change on the
# order of years; market cap moves daily, but the peer ladder compares in BANDS (a quarter
# to four times), which a month of drift does not cross.
# MARKET-INDEX-2 - which VENUES a listing may sit on, per exchange. An exchange absent
# from this map is unrestricted.
#
# The US listing returned 17,829 common stocks on 2026-09-18, of which 11,508 were OTC
# (PINK 8,644, OTCQB 1,252, OTCQX 498, OTCGREY 486, OTCCE 475, OTCMKTS 144, OTC 6,
# OTCBB 3). Fetching those is ~118,000 charged units - more than a whole day's budget -
# for names no lens should rank. The filter is applied to the LISTING row, before any
# fundamentals call, so an excluded venue costs nothing at all.
#
# Every venue string seen is printed with a count once per build, including the ones
# dropped, so a venue worth adding here is visible rather than silently missing. BATS (39)
# NYSE MKT (19) and a bare "US" (227) were seen and are NOT admitted by default - say so
# here if you want them.
venues:
  US: [NYSE, NASDAQ, NYSE ARCA, AMEX]

max_age_days: 30

# INDEX-CAP-RETRY-1 - how patient to be about a gap the provider does not have.
#
# MEASURED, 2026-09-24: 2,566 rows carry no market cap and 1,767 no classification, and every
# one was fetched WITH A NAME - the provider answered and simply had nothing. A direct probe of
# /fundamentals/0052.TW returns "MarketCapitalization": "NA", an explicit not-available rather
# than a blank or a timeout. The 2026-09-23 build refetched 1,502 such rows and filled NONE, at
# roughly 15,000 charged units.
#
# So a row that has been asked and come back empty this many times is left alone for this many
# days. status splits the gap-less rows into "due" and "waiting" so the next build's cost is
# visible before it is spent.
empty_retry_after: 2
empty_retry_days: 30

root: data/local/market_index
