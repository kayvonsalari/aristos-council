# MARKET-INDEX-1 — which venues the local market index tracks.
#
# The index is a table of every listed COMMON STOCK with its classification and size,
# built once from EODHD and queried locally. It exists because no per-report peers
# endpoint works on this plan: Finnhub /stock/peers is 403 for every non-US symbol and
# caps at 12 names where it answers, EODHD's /screener is 403, and S&P 500 + STOXX 600
# together hold a median of six companies per industry. See docs/MARKET_INDEX.md.
#
# Editing this file changes what a BUILD fetches. It does not change a table already
# built: rows are keyed by ticker and only removed by deleting the index.
#
# Cost: roughly one call per listed common stock, plus one per exchange for the listing.
# Rows younger than max_age_days are skipped without a call, so a re-run is cheap.

exchanges:
  # North America
  - US            # NYSE + NASDAQ + AMEX, the deepest single pool of comparables
  - TO            # Toronto
  # Europe
  - XETRA
  - LSE
  - PA            # Euronext Paris
  - AS            # Euronext Amsterdam
  - MC            # Madrid
  - MI            # Milan
  - SW            # SIX Swiss
  - ST            # Stockholm
  - CO            # Copenhagen
  - OL            # Oslo
  - HE            # Helsinki
  # Asia-Pacific and Latin America — where the comparables for a chip maker, a miner or
  # a shipping line are actually listed. Peers follow the industry, not the listing.
  - HK
  - T             # Tokyo
  - KS            # Korea
  - AU            # Australia
  - TW            # Taiwan
  - SA            # Brazil

# A row older than this is refetched by `refresh`. Classification and venue change on the
# order of years; market cap moves daily, but the peer ladder compares in BANDS (a quarter
# to four times), which a month of drift does not cross.
# MARKET-INDEX-2 - which VENUES a listing may sit on, per exchange. An exchange absent
# from this map is unrestricted.
#
# The US listing returned 17,829 common stocks on 2026-09-18, of which 11,508 were OTC
# (PINK 8,644, OTCQB 1,252, OTCQX 498, OTCGREY 486, OTCCE 475, OTCMKTS 144, OTC 6,
# OTCBB 3). Fetching those is ~118,000 charged units - more than a whole day's budget -
# for names no lens should rank. The filter is applied to the LISTING row, before any
# fundamentals call, so an excluded venue costs nothing at all.
#
# Every venue string seen is printed with a count once per build, including the ones
# dropped, so a venue worth adding here is visible rather than silently missing. BATS (39)
# NYSE MKT (19) and a bare "US" (227) were seen and are NOT admitted by default - say so
# here if you want them.
venues:
  US: [NYSE, NASDAQ, NYSE ARCA, AMEX]

max_age_days: 30

root: data/local/market_index
