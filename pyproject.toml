[project]
name = "aristos-council"
version = "0.1.0"
description = "A multi-agent financial research analyst — specialists deliberate, a critic dissents, a human holds the veto."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "langgraph>=0.2",
    # Anthropic provider integration for init_chat_model. A hard dependency so
    # cold-start Colab runtimes always have it — a base install left it missing
    # and the live run died inside init_chat_model. Tests never import it (the
    # runner imports lazily and tests inject FakeRunners), so this costs the
    # test suite nothing but the install footprint.
    "langchain-anthropic>=0.3",
]

[project.optional-dependencies]
# Dev-time market data provider (Phase 1). Kept optional so unit tests run
# without network access or the yfinance dependency installed.
yfinance = ["yfinance>=0.2.40"]
# The LangChain framework half of real LLM runs (langchain.chat_models.
# init_chat_model). The Anthropic provider integration is a hard dependency
# above. Tests do NOT need this.
llm = ["langchain>=0.3"]
# Optional LangSmith tracing for LIVE runs (env-gated; no key = silent no-op).
# langsmith is already pulled transitively by langgraph/langchain; pinning it
# under this extra documents the live-with-tracing install (".[llm,tracing]").
# CI installs ".[dev]" only, so tracing is never a CI/test dependency.
tracing = ["langsmith>=0.1"]
# Council Station — the local Streamlit UI (app.py). Browsing past runs needs
# only this group; LAUNCHING a council additionally needs ".[yfinance,llm]"
# (and the runtime API keys), so the full install is ".[ui,yfinance,llm]".
ui = [
    "streamlit>=1.30",
    "python-dotenv>=1.0",
    # IANA tz database for zoneinfo — Windows has no system tz source, and the
    # UI converts UTC timestamps to Europe/Berlin for display.
    "tzdata",
    # "Export PDF" — purpose-built A4 council record via HTML-to-PDF (pure
    # Python, installs cleanly on Windows) + markdown -> HTML for agent prose.
    "xhtml2pdf>=0.2.16",
    "markdown>=3.4",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
# ``--strict-markers``: a typo'd ``@pytest.mark.real_adaptor`` is a silent no-op by
# default, and a silent no-op here means the test reaches the network after all.
addopts = "-q --strict-markers"
# TEST-ISOLATION-1. The suite refuses to build a real data adapter (tests/conftest.py);
# this marker is the written opt-out, for the handful of tests that are ABOUT the
# provider. It also makes them skip without yfinance, per the repo's importorskip
# convention. Declared here so an unknown-marker typo is an error, not a silent no-op.
markers = [
    "real_adapter: this test exercises the real provider factory on purpose",
]
