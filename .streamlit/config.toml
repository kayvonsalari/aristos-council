# Aristos theme (UI-POLISH-1) - calm, dark, professional. One accent; the verdict colours (BUY green,
# HOLD amber, SELL red) are applied in code by aristos_council/ui_style.py, never decoratively.
# The custom CSS (chips, cards, fonts) lives in ONE file, ui_style.py; this file is Streamlit's own,
# supported theming route for the page, panel, text and accent colours.

[theme]
base = "dark"
backgroundColor = "#0E1217"          # page
secondaryBackgroundColor = "#161D26" # panels, cards, sidebar, inputs
textColor = "#E6EAF0"
primaryColor = "#7FB2FF"             # the single accent
borderColor = "#263241"
font = "sans-serif"                  # IBM Plex Sans is added by ui_style.py's CSS (Google Fonts)

[client]
# "minimal" hides the Deploy button and the developer menu (measured on Streamlit 1.58: the whole
# top-right menu goes with them, so the app is dark and stays dark unless a Streamlit light theme is
# forced, e.g. `streamlit run app.py --theme.base light`). The custom CSS has a light palette for that
# case (ui_style.LIGHT); we deliberately do NOT define [theme.light] here, because that would make
# Streamlit follow the visitor's operating-system setting and open the product in light.
toolbarMode = "minimal"

[browser]
gatherUsageStats = false
