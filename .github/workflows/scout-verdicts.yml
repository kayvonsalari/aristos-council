# Scout → Aristos verdicts: weekly deterministic re-grade of newly scouted tickers.
#
# Reads the FT (and, once configured, Economist) scout sheets, merges the week's
# tickers into growth_40_v1, runs the multi-lens ranker (no LLM, no API keys, no
# spend), and commits per-source results to reports/scout/{ft,economist}/ plus the
# frozen run records in runs/. It then formats the results deterministically into
# dist/ (one workbook, three tabs + summary.json) and, when GOOGLE_SERVICE_ACCOUNT_JSON
# is set, writes them straight into the master Google Sheet — no LLM in the publish
# path. The Cowork "aristos-publish" task only reads dist/summary.json to notify.
#
# Free on this public repo. Manual run: Actions tab → this workflow → Run workflow.

name: scout-verdicts

on:
  schedule:
    - cron: "45 6 * * 6"        # Saturday 06:45 UTC (~07:45/08:45 UK) — before the
                                # 09:30-UK Cowork publish task
  workflow_dispatch:
    inputs:
      window_days:
        description: "Lookback window in days"
        default: "8"
        required: false

permissions:
  contents: write

concurrency:
  group: scout-verdicts
  cancel-in-progress: false

jobs:
  grade:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # `secrets` is NOT available in a step-level `if:` — lift it into env and
      # test env there instead, or the push step silently never runs.
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      MASTER_SHEET_ID: 1wDYdPDI_XDBTvx_ttmFskNbVpVDPonSJy_-auPY_Hb4
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install (yfinance extra — deterministic ranker only, no LLM)
        run: pip install -e ".[yfinance]"

      - name: Run scout verdicts
        env:
          SCOUT_WINDOW_DAYS: ${{ github.event.inputs.window_days || '8' }}
          # Optional: set the Economist sheet CSV export URL as a repo variable
          # (Settings → Secrets and variables → Actions → Variables) once the
          # sheet exists. Leave unset until then — the script skips it cleanly.
          SCOUT_SHEET_ECONOMIST: ${{ vars.SCOUT_SHEET_ECONOMIST }}
        run: python scripts/scout_verdicts.py

      - name: Install publisher deps
        run: pip install --quiet openpyxl google-auth google-api-python-client

      # Always produced, credentials or not: dist/aristos_verdicts_<run_date>.xlsx
      # (three named tabs) and dist/summary.json (digest for the notification).
      # --max-age-days 3 exits 3 if the grader did not actually refresh the reports.
      - name: Build verdict workbook
        run: |
          python scripts/publish_verdicts.py \
            --reports reports/scout \
            --out dist \
            --max-age-days 3

      # Appends this week's rows to the master sheet and creates "Holdings
      # Verdicts" on first run. Skipped cleanly until the secret exists.
      - name: Push tabs into master spreadsheet
        if: ${{ env.GOOGLE_SERVICE_ACCOUNT_JSON != '' }}
        run: |
          python scripts/publish_verdicts.py \
            --reports reports/scout \
            --out dist \
            --spreadsheet-id "$MASTER_SHEET_ID" \
            --append

      - name: Commit results
        run: |
          git config user.name "aristos-scout[bot]"
          git config user.email "actions@users.noreply.github.com"
          git add reports/scout runs verdicts dist || true
          if git diff --cached --quiet; then
            echo "nothing to commit"
          else
            git commit -m "scout verdicts $(date -u +%F) [skip ci]"
            git push
          fi
