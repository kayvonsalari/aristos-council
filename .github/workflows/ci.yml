name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # Three jobs so one slow group cannot starve the rest. Job id `test` keeps the check names
  # "CI / test (3.11)" and "(3.12)".
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install (test deps + the ibkr and ui extras — no network providers in CI)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,ibkr,ui]"

      - name: Run tests (parallel; the notebook cells and the report sweep run in their own jobs)
        run: pytest -n auto -m "not notebook" --ignore=tests/test_report_sweep.py --cov=aristos_council --cov-report=term-missing

  notebook:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,ibkr,ui]"
      - name: Run the notebook cell tests
        run: pytest -m notebook

  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,ibkr,ui]"
      - name: Run the report sweep
        run: pytest tests/test_report_sweep.py
