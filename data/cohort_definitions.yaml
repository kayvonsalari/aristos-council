# COHORT-3 - cohorts built from the MARKET INDEX (data/local/market_index/index.parquet), through the
# same cleaned pool the peer groups use: one row per company, receipts and foreign lines out,
# size-suspect and classification-suspect rows out, label overrides and identity aliases applied.
# Every market the index carries EXCEPT Sao Paulo (SA) - written `exchanges: [ALL]`.
#
# This file is separate from data/local/cohorts/definitions.yaml (COHORT-1: ten rules, own-currency
# floors, S&P 500 + STOXX 600 constituents), which is untouched so that old cohort versions can be
# reproduced with `--constituents`. No name below collides with one of those ten, and no existing
# frozen cohort version is ever rebuilt or overwritten by this list (a build of a slug that is
# already frozen skips it and says so).
#
# NOTHING IN THIS FILE IS A LIST OF COMPANIES. Each cohort is a rule: EODHD `General::Industry`
# codes, read from the real index (probed 2026-09-25 - not guessed), plus a USD floor.
#
# THE USD FLOOR is set per cohort between $1bn and $10bn (the loader refuses anything else) by ONE
# stated rule, applied mechanically and never revisited after a band result was seen:
#
#     n1 = companies in the cohort's codes with a USD market cap >= $1bn (cleaned pool, no Sao
#          Paulo, financials and REITs excluded) - how CROWDED the industry is.
#     n1 <=  40  ->  $1bn        41-70 -> $2bn        71-100 -> $3bn
#     101-160    ->  $5bn      > 160   -> $10bn
#
# Crowded industries get larger floors and sparse ones smaller. The floor is NOT a knob for hitting
# a member count: the 20-60 band rule is unchanged, a cohort under 20 reports TOO THIN and one over
# 60 reports TOO WIDE with a narrower-code suggestion, and nothing is padded or truncated. Some of
# the cohorts below land outside the band; `python -m aristos_council.cohorts plan` says which.
#
# `min_market_cap_usd` is tested against the index's USD conversion. `min_market_cap` (own currency)
# is deliberately absent: it belongs to the constituents path.
#
# `watch: false` on every cohort. The daily watcher runs only cohorts flagged `watch: true`; there
# is no watcher in this repository yet (Sprint 4F is a plan), so the flag is stored, parsed and
# printed by `plan`, and nothing reads it beyond that. Which cohorts to watch is the owner's call.
#
# GUIDE ENTRIES MERGED OR DROPPED (the index has no clean code, or too few companies, for them):
#   - water utilities (11 companies above $1bn in the index): merged into gas + multi-utilities
#   - tobacco (11): merged into beverages
#   - aluminum (11) with copper; paper (9) with packaging; airports (11) with airlines
#   - NOT covered, no entry in the guide: coal (Thermal 11, Coking 5), uranium (12), silver (7),
#     other precious metals (20), solar (12), lumber (6), conglomerates (55), industrial
#     distribution, rental & leasing, business services, education, and the 11 + 6 + 4 + 1 companies
#     filed under the index's second, TRBC-style vocabulary ("Semiconductors & Semiconductor
#     Equipment", "Pharmaceuticals", "Machinery, Tools, Heavy Vehicles, Trains & Ships",
#     "Biotechnology & Medical Research"). Their labels are in no cohort's codes, so they are in none.

cohorts:

  # guide: integrated oil and gas
  # n1 = 21 (Oil & Gas Integrated 21) -> tier $1bn
  - name: "Energy - Integrated Oil & Gas"
    industry: ["Oil & Gas Integrated"]
    exchanges: [ALL]
    min_market_cap_usd: 1000000000
    min_history_years: 5
    exclude: [financials, reits]
    watch: false
    anchors: []

