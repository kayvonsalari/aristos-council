# PEER-ADR-ALIAS-1 - the PrimaryTicker the provider left out or got wrong, for the market index's
# peer groups. DATA CORRECTIONS ONLY: it changes one field (primary_ticker) on the rows a query
# reads, never a size, a label or a peer directly, and the index on disk is not rewritten. Once a
# line is aliased the existing rules do the rest: it falls in its home line's company, so it is
# never that company's own peer and never a second member of a cohort. Every alias a cohort used
# is printed in its report as "identity aliased".
#
# Each entry needs: ticker (the line to correct, EODHD form), primary (the home line's EODHD
# ticker), date, reason.
#
# Add an entry only for a line that is plainly the same company as its primary, with the evidence
# in the reason. `python -m aristos_council.market_index status` lists ADR/ADS rows that nothing
# links to a home, which is where the next candidate will show up.
aliases:
  - ticker: GSK.US
    primary: GSK.LSE
    date: 2026-09-25
    reason: >-
      "GlaxoSmithKline PLC ADR" names itself as its PrimaryTicker and carries its own ISIN, and
      its name (glaxosmithkline) is not GSK's, so no handle and no name link joins it to GSK.LSE.
      Measured: AZN.LSE's cohort held GSK twice ($102.5bn and $100.6bn).
  - ticker: SKHY.US
    primary: 000660.KO
    date: 2026-09-25
    reason: >-
      "SK Hynix Inc. American Depositary Shares" carries no PrimaryTicker, and its size is 1.37x
      000660.KO's (stale price), beyond the name-link tolerance. Measured: SK Hynix appeared twice
      in 2330.TW's cohort.
  # COHORT-3 - found by reading the cohort plan by eye: the same company standing twice in one
  # cohort. None of these can be caught by a name rule (different names, preference or exchangeable
  # lines, a renamed company), so each is stated here with its evidence.
  - ticker: BP-A.LSE
    primary: BP.LSE
    date: 2026-09-25
    reason: >-
      BP's cumulative preference line (ISIN GB0001385250). The provider gives it the WHOLE
      company's market cap ($147bn against $116bn for the ordinary line), so it stood as a second
      BP in Integrated Oil & Gas and, sorting '-' before '.', took the seat.
  - ticker: BP-B.LSE
    primary: BP.LSE
    date: 2026-09-25
    reason: >-
      BP's second preference line: no ISIN, no PrimaryTicker, the whole company's cap ($142bn).
  - ticker: SNN.US
    primary: SN.LSE
    date: 2026-09-25
    reason: >-
      "Smith & Nephew SNATS Inc" is Smith & Nephew's ADS (US83175M2052). It names itself as home and
      its name carries no ADR wording, so nothing linked it to SN.LSE: $11.5bn each, twice in
      Medical Devices.
  - ticker: SRT3.XETRA
    primary: SRT.XETRA
    date: 2026-09-25
    reason: >-
      Sartorius AG's two share lines (DE0007165631 and DE0007165607, the second named "VZO O.N."),
      under different names and 1.25x apart, so neither the name link nor a shared handle joined them.
  - ticker: TAP-A.US
    primary: TAP.US
    date: 2026-09-25
    reason: >-
      Molson Coors Class A (US60871R1005); the company is "Molson Coors Beverage Company" on this
      line and "Molson Coors Brewing Co Class B" on TAP.US.
  - ticker: TPX-B.TO
    primary: TAP.US
    date: 2026-09-25
    reason: >-
      Molson Coors Canada Inc's exchangeable shares (CA6087112067), which are Molson Coors stock by
      another name.
  - ticker: QSP-UN.TO
    primary: QSR.TO
    date: 2026-09-25
    reason: >-
      Restaurant Brands International Limited Partnership units, exchangeable one-for-one into
      the shares on QSR.TO.
  - ticker: CSC.AU
    primary: CS.TO
    date: 2026-09-25
    reason: >-
      Capstone Copper Corp is the renamed Capstone Mining Corp (CS.TO); the ASX line has no ISIN
      and no PrimaryTicker and the two names no longer match.
  - ticker: CKI.LSE
    primary: 1038.HK
    date: 2026-09-25
    reason: >-
      "Ck Infra Holdings Ltd" is CK Infrastructure Holdings' London line: no ISIN, no
      PrimaryTicker, $20.65bn against $20.96bn.
  - ticker: ALI1.XETRA
    primary: AII.AU
    date: 2026-09-25
    reason: >-
      "ALMONTY INDUSTRY O.N." is Almonty Industries' Xetra line (its PrimaryTicker names AII.TO, which
      the index does not carry), $4.0bn against $5.2bn on the ASX line.
