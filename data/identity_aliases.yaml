# PEER-ADR-ALIAS-1 - the PrimaryTicker the provider left out or got wrong, for the market index's
# peer groups. DATA CORRECTIONS ONLY: it changes one field (primary_ticker) on the rows a query
# reads, never a size, a label or a peer directly, and the index on disk is not rewritten. Once a
# line is aliased the existing rules do the rest: it falls in its home line's company, so it is
# never that company's own peer and never a second member of a cohort. Every alias a cohort used
# is printed in its report as "identity aliased".
#
# Each entry needs: ticker (the line to correct, EODHD form), primary (the home line's EODHD
# ticker), date, reason.
#
# Add an entry only for a line that is plainly the same company as its primary, with the evidence
# in the reason. `python -m aristos_council.market_index status` lists ADR/ADS rows that nothing
# links to a home, which is where the next candidate will show up.
aliases:
  - ticker: GSK.US
    primary: GSK.LSE
    date: 2026-09-25
    reason: >-
      "GlaxoSmithKline PLC ADR" names itself as its PrimaryTicker and carries its own ISIN, and
      its name (glaxosmithkline) is not GSK's, so no handle and no name link joins it to GSK.LSE.
      Measured: AZN.LSE's cohort held GSK twice ($102.5bn and $100.6bn).
  - ticker: SKHY.US
    primary: 000660.KO
    date: 2026-09-25
    reason: >-
      "SK Hynix Inc. American Depositary Shares" carries no PrimaryTicker, and its size is 1.37x
      000660.KO's (stale price), beyond the name-link tolerance. Measured: SK Hynix appeared twice
      in 2330.TW's cohort.
  # COHORT-3 - found by reading the cohort plan by eye: the same company standing twice in one
  # cohort. None can be caught by a name rule (different names, preference or exchangeable lines, a
  # renamed company), so each is stated here with its evidence. Every one was re-checked on
  # 2026-09-25 against an independent source (Yahoo Finance listings, and the issuer's own filings or
  # website for the structural claims); nothing here rests on the index alone.
  - ticker: BP-A.LSE
    primary: BP.LSE
    date: 2026-09-25
    reason: >-
      BP's 8% cumulative first preference shares (bp.com share listing information: LSE symbol
      BP.A). The index gives this line BP's name and a market cap of $147bn, the same order as the
      whole company's $116bn; Yahoo lists it as "BP p.l.c." with no market cap of its own. It stood as
      a second BP in Integrated Oil & Gas and, sorting '-' before '.', took the seat.
  - ticker: BP-B.LSE
    primary: BP.LSE
    date: 2026-09-25
    reason: >-
      BP's 9% cumulative second preference shares (bp.com share listing information: LSE symbol
      BP.B). No ISIN or PrimaryTicker in the index, BP's name, a market cap of $142bn against the
      company's $116bn, and no market cap of its own on Yahoo.
  - ticker: SNN.US
    primary: SN.LSE
    date: 2026-09-25
    reason: >-
      "Smith & Nephew SNATS Inc" is Smith & Nephew's ADS (US83175M2052): Yahoo lists both this line
      and SN.L as "Smith & Nephew plc". Its name carries no ADR wording and it names itself as home,
      so nothing linked it to SN.LSE ($11.5bn each in the index).
  - ticker: SRT3.XETRA
    primary: SRT.XETRA
    date: 2026-09-25
    reason: >-
      Sartorius AG's two share lines (DE0007165631 and DE0007165607): Yahoo lists both SRT3.DE and
      SRT.DE as "Sartorius Aktiengesellschaft". The index names them differently ("...
      Aktiengesellschaft" and "... AG VZO O.N.") and 1.25x apart, so neither the name link nor a shared
      handle joined them. Sartorius Stedim Biotech is a separate company and is not aliased.
  - ticker: TAP-A.US
    primary: TAP.US
    date: 2026-09-25
    reason: >-
      Molson Coors' Class A common stock (US60871R1005): Yahoo lists both TAP-A and TAP as "Molson
      Coors Beverage Company". The index names the two lines differently ("Molson Coors Beverage
      Company" and "Molson Coors Brewing Co Class B").
  - ticker: TPX-B.TO
    primary: TAP.US
    date: 2026-09-25
    reason: >-
      Molson Coors Canada Inc.'s Class B exchangeable shares (CA6087112067). Molson Coors' 10-K
      describes them as shares of its wholly-owned subsidiary, exchangeable for its Class B common
      stock and intended to give "substantially the same economic and voting rights". Yahoo's
      C$10.3bn is about US$7.4bn, matching the index and the parent's own cap.
  - ticker: QSP-UN.TO
    primary: QSR.TO
    date: 2026-09-25
    reason: >-
      Restaurant Brands International Limited Partnership Class B exchangeable units (TSX: QSP).
      RBI's SEC filings describe the partnership as its subsidiary and state that an exchange of the
      units cancels them and reduces RBI's fully diluted common shares by the same number, so the
      units are RBI equity under another name. Yahoo lists the same legal name; the index's cap for
      the units ($24.8bn) is a subset of the shares' ($33.4bn).
  - ticker: CSC.AU
    primary: CS.TO
    date: 2026-09-25
    reason: >-
      Capstone Copper Corp is the renamed Capstone Mining Corp: Yahoo lists both CSC.AX and CS.TO as
      "Capstone Copper Corp." with the same market cap (A$11.08bn and C$11.11bn). The ASX line has no
      ISIN or PrimaryTicker in the index and the two names no longer match.
  - ticker: CKI.LSE
    primary: 1038.HK
    date: 2026-09-25
    reason: >-
      "Ck Infra Holdings Ltd" is CK Infrastructure Holdings' London line: Yahoo lists both CKI.L and
      1038.HK as "CK Infrastructure Holdings Limited", and the index gives $20.65bn against $20.96bn.
      No ISIN or PrimaryTicker in the index.
  - ticker: ALI1.XETRA
    primary: AII.AU
    date: 2026-09-25
    reason: >-
      "ALMONTY INDUSTRY O.N." is Almonty Industries' Xetra line: Yahoo lists both ALI1.DE and AII.AX
      as "Almonty Industries Inc." (its PrimaryTicker in the index names AII.TO, which the index does
      not carry).
  - ticker: ADEA.US
    primary: ADEA.US
    date: 2026-09-25
    reason: >-
      A SELF-alias, which cancels a wrong PrimaryTicker: the provider gives Adeia (ADEA.US,
      US00676P1075, $2.8bn) the PrimaryTicker XPER.US, but XPER.US is Xperi Inc. (US98423J1016,
      $0.27bn), a separate company that trades on its own (Yahoo shows both live, with different
      names and market caps). Read as one company, the two-line size rule refused the larger,
      correct row as a size outlier.
