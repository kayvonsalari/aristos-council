# COHORT-3 - corrections to a market cap the index reports, for peer groups and cohorts.
# DATA CORRECTIONS ONLY: `set` replaces one USD figure, `exclude` refuses to use one, on the rows a
# query reads; the index on disk is not rewritten. Every use is FLAGGED (section sign) in the cohort
# lists and reports that contain the company, and an excluded company is listed there with its
# reported figure and this reason - never silently dropped. Same discipline as
# data/label_overrides.yaml and data/identity_aliases.yaml.
#
# Each entry needs: ticker (EODHD form), action (exclude | set), date, reason.
# `set` also needs market_cap_usd. `exclude` takes none: a figure with no correct value to replace it
# is refused, not guessed.
#
# Add an entry only with evidence in the reason, and prefer `set` only when the correct figure is
# established by a source that does not share the error.
corrections:
  - ticker: QH.US
    action: exclude
    date: 2026-09-25
    reason: >-
      Quhuo Limited's American Depositary Shares read $343.3bn in the index (EODHD) and $350.4bn on
      Yahoo. Both are the ADS price ($3.98) multiplied by 87.9 billion ORDINARY shares, and one ADS
      is many ordinary shares, so the figure is overstated by that ratio. Annual revenue is $2.5bn,
      which makes the stated cap 136 times revenue for a gig-logistics business. The true cap cannot
      be established from either source, so the company is excluded instead of being given a figure.
  - ticker: LISN.SW
    action: set
    market_cap_usd: 24560000000
    date: 2026-09-26
    reason: >-
      Lindt & Spruengli's registered shares (LISN.SW) read USD 118.4bn (CHF 97.2bn) in the index,
      five times its participation certificate line LISP.SW (CHF 19.7bn). One registered share is worth
      ten participation certificates (nominal CHF 100 against CHF 10), and the two lines are one
      company, so a CHF 97.2bn figure for one class cannot be the company's capitalisation.
      Lindt's total market capitalisation is about CHF 20.2bn:
      stockanalysis.com/quote/swx/LISN/market-cap/ gives CHF 20.16bn on 2026-09-25, and EODHD's own
      LISP.SW row (CHF 19.72bn) agrees. Converted at the index's own CHF rate (1.2183 USD per CHF,
      LISP.SW's USD / local figure): 20.16bn x 1.2183 = USD 24.56bn.
  - ticker: LTOD.LSE
    action: exclude
    date: 2026-09-26
    reason: >-
      Larsen & Toubro's London line (USD 30.5bn, ISIN USY5217N1183, no PrimaryTicker) is a Regulation S
      global depositary receipt for an Indian company: it is filed by the provider as Diversified
      Metals & Mining, which put it in BHP's peer group, and it has no home line in the index (India
      is not a covered market), so its size cannot be checked against a second line. The company is
      excluded rather than given a figure or a peer group it does not belong in.
  - ticker: CCZ.US
    action: exclude
    date: 2026-09-26
    reason: >-
      CCZ is not a share. It is "Comcast Holdings Corp. 2.0% Exchangeable Subordinated Debentures due
      October 15, 2029" (Comcast's ZONES), a bond-like security issued by Comcast Holdings and
      guaranteed by Comcast Corporation, whose exchange value follows other companies' shares; it
      trades on the NYSE under CCZ. The index reads it as a company with a $61.1bn market cap, files it
      under REIT - Residential (EODHD's industry) and Integrated Telecommunication Services (its GICS
      copy, inherited from Comcast), and it stood in Tencent's step-4 sector group beside CMCSA.US.
      Public sources: Comcast Corporation's shareholder FAQ and its Form 10-Q filed 2026-04-23 (both at
      cmcsa.com) describe the exchangeable subordinated debt; the security's listing title is quoted at
      upstox.com/us-stocks/ccz-share-price/. It is excluded rather than given a figure.
  - ticker: TYT.LSE
    action: exclude
    date: 2026-09-30
    reason: >-
      BACKTEST-1B's price-sanity check flagged TYT.LSE (Toyota Motor Corporation's London line, priced
      in JPY) for a one-day adjusted-close ratio of x9.9 on 2017-04-28 in yfinance's series: close
      1224.83 on 2017-04-27, 12120.11 on 2017-04-28, back to 1228.75 on 2017-05-02, the very next
      session. A company the size of Toyota moving 10x in a day and giving all of it back by the next
      print is a bad tick, not a trade; yfinance's own split/action history records nothing on or near
      that date (its one recorded split is 2021-09-29, unrelated). EODHD's own /eod endpoint 403s on
      the current plan, so a second-source cross-check was not available; the reversion pattern alone
      is conclusive. Excluded from cohort/peer market-cap use rather than given a figure; the backtest
      package independently flags this series with a price_warning rather than silently trusting it.
